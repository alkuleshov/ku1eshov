<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Пространство Кулешова</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Белый холст на весь экран — mind map в центре, сгруппированная по категориям.
   Панель сводки плавает справа отдельной карточкой: блоки сворачиваются
   и переставляются по приоритету, порядок и состояние запоминаются локально. */
:root{
  --paper:#FFFFFF; --ink:#15202B; --ink-2:#5B6872; --ink-3:#95A0A8;
  --line:#E4E7EA; --panel:#FFFFFF; --panel-line:#E9ECEE; --chip-bg:#F3F5F6;
  --accent:#E4572E;
  --ok:#2F7D5B; --ok-soft:#E1F1E8; --warn:#B4610A; --warn-soft:#FCEFDC; --bad:#B42318; --bad-soft:#FAE2DF; --idle:#DCE8EF; --idle-ink:#3B6E8F;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
  --cat-infra:#2E6F8E;   --cat-domains:#B4610A; --cat-ai:#6E4FA0; --cat-subs:#C23B6D;
  --cat-credit:#8A6D1F;  --cat-tax-ip:#B42318;  --cat-tax-pers:#A13D7C; --cat-life:#3E7D4E;
  --cat-income:#1F8F63;
  --up:#2F7D5B; --down:#B42318;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);overflow:hidden}
.canvas{position:fixed;inset:0;z-index:1}
#map{position:absolute;inset:0;width:100%;height:100%}

.brand{position:fixed;top:max(20px,env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none;max-width:60vw}
.brand .label{font:500 10.5px/1 var(--f-data);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.brand h1{font:600 clamp(18px,3.4vw,22px)/1.15 var(--f-display);margin:2px 0 0;letter-spacing:-.01em}
.brand .meta{margin-top:6px;font:400 11.5px/1.5 var(--f-data);color:var(--ink-3)}
.brand .meta b{color:var(--ink-2);font-weight:500}

.legend{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;flex-wrap:wrap;gap:8px 14px;max-width:320px}
.legend span{display:flex;align-items:center;gap:6px;font:400 11.5px var(--f-data);color:var(--ink-2)}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}

/* плавающая панель — отдельная карточка над холстом, никогда не ложится на узлы карты */
.panel{
  position:fixed;top:max(20px,env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));
  z-index:10;width:368px;max-width:calc(100vw - 32px);
  max-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;
  box-shadow:0 2px 6px rgba(21,32,43,.04),0 16px 40px rgba(21,32,43,.10);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.panel-in{padding:8px}

.block{border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.block-head{display:flex;align-items:center;gap:6px;padding:12px 10px}
.block-head h2{flex:1;min-width:0;font:500 13.5px/1.2 var(--f-display);margin:0;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font:500 10.5px/1 var(--f-data);color:var(--ink-3);white-space:nowrap}
.iconbtn{appearance:none;border:0;background:none;padding:5px;margin:0;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--ink-3);cursor:pointer;flex:none}
.iconbtn:hover{background:var(--chip-bg);color:var(--ink-2)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn:disabled:hover{background:none}
.iconbtn svg{width:14px;height:14px;display:block}
.js-hide{color:var(--bad)}
.js-hide:hover{background:var(--bad-soft);color:var(--bad)}
.hidden-restore{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-3)}
.hidden-restore summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:4px}
.hidden-restore summary::-webkit-details-marker{display:none}
.hidden-restore summary .chev{transition:transform .15s}
.hidden-restore[open] summary .chev{transform:rotate(180deg)}
.hidden-restore ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hidden-restore li{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hidden-restore .js-restore{font-size:12px;color:var(--ok);background:none;border:0;cursor:pointer;padding:2px 6px;border-radius:6px;flex:none}
.hidden-restore .js-restore:hover{background:var(--ok-soft)}
.chev{transition:transform .15s ease}
.block.collapsed .chev{transform:rotate(-90deg)}
.block-body{padding:0 14px 16px}
.block.collapsed .block-body{display:none}
.block.dragging{opacity:.4}
.block.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.block.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.handle{cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0}
.kpi .v{font:500 22px/1.05 var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block}
.kpi .s{font-size:11.5px;color:var(--ink-2);display:block;margin-top:4px}
.kpi.alert .v{color:var(--accent)}

.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.days{font:500 15px/1 var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
.days small{display:block;font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;margin-top:3px}
.what{min-width:0}
.what b{font-weight:600;font-size:13px;display:block;overflow-wrap:anywhere}
.what span{font-size:11.5px;color:var(--ink-2)}
.amt{font:400 12px var(--f-data);color:var(--ink-2);text-align:right;white-space:nowrap}
.chip{display:inline-block;font:500 9.5px/1 var(--f-data);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:3px;margin-top:4px}
.c-bad{background:var(--bad-soft);color:var(--bad)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-idle{background:var(--idle);color:var(--idle-ink)}
.row.urgent .days{color:var(--accent)}

.todo{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.todo li{display:grid;grid-template-columns:9px minmax(0,1fr);gap:9px;align-items:start;font-size:13px;line-height:1.45}
.todo li::before{content:"";width:7px;height:7px;margin-top:5px;border:1.5px solid var(--accent);transform:rotate(45deg);flex:none}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:12px}
.bar b{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.track{height:6px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;border-radius:2px}
.bar .n{font:400 12px var(--f-data);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.channels{display:grid;gap:10px}
.ch{border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.ch b{font-weight:600;font-size:13px;display:block}
.ch p{margin:3px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.4}

.note{font-size:11px;color:var(--ink-3);margin:10px 10px 4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.fx{display:inline-flex;align-items:center;gap:3px}
.fx .arrow{width:9px;height:9px;display:inline-block}
.fx.up{color:var(--up)} .fx.down{color:var(--down)} .fx.flat{color:var(--ink-3)}

.editval{border-bottom:1px dashed var(--ink-3);cursor:text}
.editval:hover{border-color:var(--accent);color:var(--accent)}
.editval input{font:inherit;color:inherit;border:1px solid var(--accent);border-radius:4px;padding:1px 4px;width:84px;text-align:right}
.editnote{font-size:9.5px;color:var(--ink-3);display:block;margin-top:2px}

.sub{display:grid;gap:8px}
.sub .item{border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.sub .item b{font-weight:600;font-size:13px;display:block}
.sub .item .meta{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.sub details summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.sub details summary::-webkit-details-marker{display:none}
.sub details[open] summary{margin-bottom:8px}
.sub .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.cat-items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.cat-items li{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);border-radius:6px;padding:2px 4px}
.flash{animation:flashBg 1.6s ease}
@keyframes flashBg{0%{background:var(--warn-soft)}100%{background:transparent}}
.proj-card{border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:5px}
.proj-card + .proj-card{margin-top:8px}
.proj-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.proj-head b{font-size:13px}
.proj-next{font-size:11.5px;color:var(--ink-2)}
.proj-meta{font-size:10.5px;color:var(--ink-3)}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.status-dot.yes{background:var(--ok)} .status-dot.no{background:var(--bad)} .status-dot.na{background:var(--idle)}

.wheel{display:block;width:100%;height:auto;margin:2px 0 10px;overflow:visible}
.wheel .grid{fill:none;stroke:var(--line)}
.wheel .axis{stroke:var(--line)}
.wheel .shape{fill:rgba(228,87,46,.12);stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.wheel .dot{fill:var(--accent)}
.wheel .dot.na{fill:var(--ink-3)}
.wheel text{font:500 9px "JetBrains Mono",monospace;fill:var(--ink-2)}
.wheel-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wheel-cols h3{font:500 10.5px/1 var(--f-data);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 7px}
.wheel-cols ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.wheel-cols li{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.wheel-cols li b{color:var(--ink);font-weight:600;flex:none}
.auto-tag{font-size:9.5px;color:var(--ink-3);margin-left:5px;font-style:italic}

/* Мобильная версия — mind map не показываем (смысла на узком экране нет),
   вместо холста+плавающей карточки — обычная страница-приложение: шапка
   сверху, список карточек под ней, крупные тач-таргеты, без наложений. */
@media (max-width:760px){
  html,body{height:auto}
  body{overflow:visible auto;display:flex;flex-direction:column;
    padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px))
            max(18px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
    gap:14px}
  .canvas,.legend{display:none}

  .brand{position:static;order:1;pointer-events:auto;max-width:none;padding:2px 2px 4px}
  .brand .label{font-size:11px}
  .brand h1{font-size:21px}
  .brand .meta{margin-top:8px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}

  .panel{position:static;order:2;width:auto;max-width:none;max-height:none;
    border-radius:20px;box-shadow:0 1px 2px rgba(21,32,43,.05),0 10px 28px rgba(21,32,43,.08)}
  .panel-in{padding:6px}

  .note{position:static;order:3;text-align:left;max-width:none;margin:0 2px}

  /* крупнее тач-таргеты и шрифты — как в нативном iOS-приложении */
  .block-head{padding:16px 12px;gap:8px}
  .block-head h2{font-size:15px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
  .badge{display:none}
  .iconbtn{padding:9px;border-radius:9px}
  .iconbtn svg{width:16px;height:16px}
  .block-body{padding:0 16px 18px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px 15px;border-radius:14px}
  .kpi .v{font-size:24px}
  .row{grid-template-columns:44px minmax(0,1fr) auto auto;padding:12px 0}
  .sub .item{border-radius:14px;padding:13px 14px}
  .ch{border-radius:14px;padding:13px 14px}
}
</style>

/* ---------- парсинг чисел/дат в русской локали таблиц ---------- */
function parseRuNum(s) {
  if (s == null) return null;
  const t = String(s).replace(/[\s ]/g, "").replace(",", ".").trim();
  if (!t) return null;
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}
function parseRuDate(s) {
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(s || "").trim());
  if (!m) return null;
  return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}
const ARCHIVE_WORDS = ["не продлевать", "оплачено"];
function isArchivedStatus(s) {
  if (!s) return false;
  const t = String(s).toLowerCase();
  return ARCHIVE_WORDS.some(w => t.includes(w));
}
function curSym(cur) { return cur === "RUB" ? "RUB" : cur === "USD" ? "$" : cur === "EUR" ? "€" : (cur || "RUB"); }

/* ---------- редактируемое значение: клик — поле ввода — сохранить в localStorage ---------- */
function editableAmt(path, sum, unit, locked) {

  if (sum != null) return fmt();
  if (locked) return `<span class="editnote" title="Подтягивается из таблицы — впиши сумму через бота или в чате">— нет данных в таблице</span>`;
  return `<span class="editval js-edit" data-path="${path}" data-unit="${unit || "RUB"}" title="Нажми, чтобы вписать значение">— ввести</span>`;
}

  return `<span class="editval js-edit" data-path="${path}" data-unit="text" title="Нажми, чтобы вписать значение">${placeholder || "— ввести"}</span>`;
}
/* В отличие от editableAmt — кликабельно всегда, даже когда значение уже есть
   (для «Колеса баланса»: автосчёт можно переопределить вручную в любой момент). */
function clickableNumber(path, val, suffix) {

}

/* ---------- «Колесо баланса» — лёгкий SVG-радар, без доп. библиотек ---------- */
function wheelSvg(items, size) {
  const n = items.length, R = size / 2 - 52, cx = size / 2, cy = size / 2;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const rings = [2, 4, 6, 8, 10].map(v => {
    const r = (v / 10) * R;
    const poly = items.map((_, i) => pt(i, r).join(",")).join(" ");
    return `<polygon class="grid" points="${poly}"/>`;
  }).join("");
  const axes = items.map((_, i) => { const [x, y] = pt(i, R); return `<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; }).join("");
  const shapePts = items.map((it, i) => pt(i, ((it.score ?? 0) / 10) * R).join(",")).join(" ");
  const dots = items.map((it, i) => { const [x, y] = pt(i, ((it.score ?? 0) / 10) * R); return `<circle class="dot${it.score == null ? " na" : ""}" cx="${x}" cy="${y}" r="3.2"/>`; }).join("");
  const wrapLabel = (name, maxChars) => {
    const words = name.split(" ");
    const lines = [];
    let cur = "";
    for (const w of words) {
      const next = cur ? `${cur} ${w}` : w;
      if (next.length > maxChars && cur) { lines.push(cur); cur = w; } else { cur = next; }
    }
    if (cur) lines.push(cur);
    return lines;
  };
  const labels = items.map((it, i) => {
    const [x, y] = pt(i, R + 14);
    const anchor = Math.abs(x - cx) < 4 ? "middle" : x > cx ? "start" : "end";
    const lines = wrapLabel(it.name, 10);
    const y0 = y - ((lines.length - 1) * 10) / 2;
    return lines.map((ln, li) => `<text x="${x}" y="${y0 + li * 10}" text-anchor="${anchor}">${ln}</text>`).join("");
  }).join("");
  return `<svg class="wheel" viewBox="0 0 ${size} ${size}">${rings}${axes}
    <polygon class="shape" points="${shapePts}"/>${dots}${labels}</svg>`;
}

/* ---------- автозаполнение «Колеса баланса» из реальных данных дашборда ----------
   Сферы без объективного источника (здоровье, семья, обучение, отдых, межд. рынок)
   остаются ручной оценкой. Там, где источник есть — считаем автоматически при
   каждом recompute(); ручная правка через клик по значению «пришпиливает» число
   (overrides) и отключает автосчёт для этой сферы, пока правку не стёрли. */
const clamp10 = v => Math.max(0, Math.min(10, Math.round(v * 10) / 10));
const AUTO_BALANCE = {
  "Финансы": () => {
    const overdue = pm.filter(p => p.d != null && p.d < 0).length;
    const urgent = pm.filter(p => p.d != null && p.d >= 0 && p.d <= 14).length;
    const gapsRatio = pm.length ? gaps / pm.length : 0;
    return clamp10(10 - overdue * 3 - urgent * 1 - gapsRatio * 5);
  },
  "Бизнес и проекты": () => {
    const dom = pm.filter(p => p.cat === "Домены");
    const overdue = dom.filter(p => p.d != null && p.d < 0).length;
    const urgent = dom.filter(p => p.d != null && p.d >= 0 && p.d <= 14).length;
    return clamp10(10 - overdue * 3 - urgent * 1.2);
  },
  "Личная инфраструктура (Life OS)": () => {
    const fields = [
      ...DATA.payments.map(p => p.sum),
      ...DATA.incomes.map(i => i.sum),
      ...DATA.housing.flatMap(h => [h.addr, h.utilities, h.payDay, h.where]),
      ...DATA.legal.map(l => l.expiry),
      ...DATA.diplomas.flatMap(d => [d.org, d.year, d.apostil]),
    ];
    const filled = fields.filter(v => v != null && v !== "").length;
    return clamp10((filled / fields.length) * 10);
  },
};

let pm, burn, inc, soon, gaps, byCat, maxBar;

function parseTsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(l => l.length);
  if (!lines.length) return [];
  const rows = lines.slice(1).map(l => l.split("\t"));
  return rows.filter(r => r[0]).map(r => ({
    name: r[0] || "", status: (r[1] || "").trim(), pct: parseFloat((r[2] || "").replace(",", ".")) || null,
    next: r[3] || "", updated: r[4] || "", notes: r[5] || "",
  }));
}

let SHEET_SYNC = { payments: null, incomes: null }; // null = ещё не пробовали/не получилось
const PAYMENTS_TSV_URL = "";
const INCOMES_TSV_URL = "";

function parsePaymentsTsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(l => l.length);
  if (!lines.length) return [];
  const rows = lines.slice(1).map(l => l.split("\t"));
  return rows.filter(r => r[0]).map(r => {
    r = r.concat(Array(11).fill("")).slice(0, 11);
    return {
      name: r[0].trim(), cat: r[1].trim(), project: r[2].trim(), kind: r[3].trim(),
      sum: parseRuNum(r[4]), cur: r[5].trim() || "RUB", per: r[6].trim(),
      date: parseRuDate(r[7]), auto: r[8].trim(), where: r[9].trim(), status: r[10].trim(),
    };
  });
}
function parseIncomesTsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(l => l.length);
  if (!lines.length) return [];
  const rows = lines.slice(1).map(l => l.split("\t"));
  return rows.filter(r => r[0]).map(r => {
    r = r.concat(Array(6).fill("")).slice(0, 6);
    return {
      name: r[0].trim(), cat: r[1].trim(), regime: r[2].trim(),
      sum: parseRuNum(r[3]), cur: r[4].trim() || "RUB", per: r[5].trim(),
    };
  });
}
async function loadPayments() {
  if (!PAYMENTS_TSV_URL) return;
  try {
    const res = await fetch(PAYMENTS_TSV_URL, {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    DATA.payments = parsePaymentsTsv(await res.text());
    applyOverrides();
    SHEET_SYNC.payments = true;
  } catch (e) {
    SHEET_SYNC.payments = false; // не удалось — останутся прежние (встроенные) данные

async function loadIncomes() {
  if (!INCOMES_TSV_URL) return;
  try {
    const res = await fetch(INCOMES_TSV_URL, {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    DATA.incomes = parseIncomesTsv(await res.text());
    applyOverrides();
    SHEET_SYNC.incomes = true;
  } catch (e) {
    SHEET_SYNC.incomes = false;
  }
  recompute(); render(); renderFx();
  if (window.echarts && typeof drawMap === "function" && innerWidth > 760) drawMap();
}
function recompute() {
  pm = DATA.payments.map((p, i) => ({...p, _i: i, m: perMonth(p), d: daysTo(p.date)})).filter(p => !overrides[`hidden.${p._i}`] && !isArchivedStatus(p.status));
  burn = pm.reduce((a, p) => a + (p.m || 0), 0);
  inc = DATA.incomes.reduce((a, i) => a + (i.sum || 0), 0);
  soon = pm.filter(p => p.d != null && p.d >= 0 && p.d <= 30);
  gaps = pm.filter(p => p.sum == null).length;
  byCat = DATA.categories.map(c => ({...c, v: pm.filter(p => p.cat === c.name).reduce((a, p) => a + (p.m || 0), 0), n: pm.filter(p => p.cat === c.name).length}));
  maxBar = Math.max(...byCat.map(x => x.v), 1);

  DATA.balance.forEach((b, i) => {
    const calc = AUTO_BALANCE[b.name];
    if (!calc) return;
    if (`balance.${i}.score` in overrides) { b.auto = false; return; } // вручную переопределено — не трогаем
    b.score = calc();
    b.auto = true;
  });
}

        <summary><b><span class="dot" style="background:${hex}"></span>${x.name}</b>
        <span>${x.v ? rub(x.v) : x.n ? x.n + " поз." : "—"}</span></summary>
        <div class="track" style="margin-bottom:8px"><div class="fill" style="width:${(x.v / maxBar * 100).toFixed(1)}%;background:${hex}"></div></div>
        <ul class="cat-items">${items.map(p => `
          <li id="pay-${p._i}"><span>${p.name}${p.where ? `<span class="editnote">${p.where}</span>` : ""}</span>${editableAmt(`payments.${p._i}.sum`, p.sum, curSym(p.cur), !!SHEET_SYNC.payments)}</li>`).join("")}
        </ul>
      </details>`;
    }).join("")}</div>` },
  { id: "incomes", title: "Доходы", badge: "по статьям", body: () => {
    const incItems = DATA.incomes.map((x, i) => ({...x, _i: i}));
    const cats = [...new Set(DATA.incomes.map(x => x.cat))];
    return `<div class="sub">${cats.map((c, ci) => {
      const items = incItems.filter(x => x.cat === c);
      const total = items.reduce((a, x) => a + (x.sum || 0), 0);
      return `<details class="item" id="inccat-${ci}">
        <summary><b>${c}</b><span>${total ? rub(total) : items.length + " поз."}</span></summary>
        <ul class="cat-items">${items.map(x => `
          <li id="inc-${x._i}"><span>${x.name}</span>${editableAmt(`incomes.${x._i}.sum`, x.sum, curSym(x.cur), !!SHEET_SYNC.incomes)}</li>`).join("")}
        </ul>
      </details>`;
    }).join("")}</div>`; } },
  { id: "housing", title: "Жильё и коммунальные", badge: DATA.housing.length + " ед.", body: () => `
    <div class="sub">${DATA.housing.map((h, i) => `
      <details class="item">
        <summary><b>${h.name}</b><span>${editableAmt(`housing.${i}.utilities`, h.utilities, "RUB")}/мес</span></summary>
        <div class="meta">Адрес: ${editableText(`housing.${i}.addr`, h.addr)}</div>
        <div class="meta">Статус: ${h.status || "—"}</div>
        <div class="meta">День платежа: ${editableText(`housing.${i}.payDay`, h.payDay)}</div>
        <div class="meta">Где платить: ${editableText(`housing.${i}.where`, h.where)}</div>
      </details>`).join("")}</div>` },
  { id: "legal", title: "Статус и документы", badge: "", body: () => `
    <div class="sub">${DATA.legal.map(l => `
      <div class="item"><b>${l.name}${l.value ? ` — ${l.value}` : ""}</b>
        <div class="meta">${l.detail || ""}</div>
        <div class="meta">Срок/дата продления: ${l.expiry ? fmtDate(l.expiry) : '<span class="editnote">пока не внесено</span>'}</div>
      </div>`).join("")}</div>` },
  { id: "diplomas", title: "Дипломы", badge: "", body: () => `
    <div class="sub">${DATA.diplomas.map(d => {
      const dot = d.apostil === true ? "yes" : d.apostil === false ? "no" : "na";
      const label = d.apostil === true ? "апостилирован" : d.apostil === false ? "не апостилирован" : "статус неизвестен";
      return `<div class="item"><b>${d.name}</b>
        <div class="meta">${d.org || "вуз уточнить"}${d.year ? ", " + d.year : ""}</div>
        <div class="meta"><span class="status-dot ${dot}"></span>${label}</div>
        <div class="meta">${d.note || ""}</div></div>`;
    }).join("")}</div>` },
  { id: "channels", title: "Каналы", badge: "", body: () => `
    <div class="channels">
      <div class="ch"><b>Telegram · @kulplans_bot</b><p>Голос или текст → строка в таблице и событие в «Оплаты».</p></div>
      <div class="ch"><b>Claude · Google Sheets</b><p>Любой чат читает и правит ту же таблицу.</p></div>
      <div class="ch"><b>iCloud «Оплаты»</b><p>Даты из таблицы, напоминания за 3 дня и за день.</p></div>
      <div class="ch"><b>ku1eshov.ru/space</b><p>«Платежи» и «Доходы» подтягиваются напрямую из той же таблицы, что бот и чат, — правки тут делай через бота или в чате. Остальные блоки (Жильё, Документы, Дипломы, Колесо баланса) пока правятся прямо тут и живут только в этом браузере.</p></div>
    </div>` }
];

const STORE_KEY = "prostranstvo-kuleshova-panel-v1";
function loadLayout() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.order) || typeof parsed.collapsed !== "object") return null;
    return parsed;
  } catch (e) { return null; }
}
function saveLayout(order, collapsed) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ order, collapsed })); } catch (e) {}
}

const saved = loadLayout();
const byId = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
let order = saved && saved.order.every(id => byId[id]) && saved.order.length === SECTIONS.length
  ? saved.order.slice() : SECTIONS.map(s => s.id);
let collapsed = saved ? { ...saved.collapsed } : {};

const panelIn = document.getElementById("panel-in");

function render() {
  panelIn.innerHTML = order.map((id, i) => {
    const s = byId[id];
    const isCollapsed = !!collapsed[id];
    return `<section class="block${isCollapsed ? " collapsed" : ""}" data-id="${id}">
      <div class="block-head">
        <span class="iconbtn handle" draggable="true" aria-label="Переставить блок">${ICON_GRIP}</span>
        <h2>${s.title}</h2>
        ${s.badge ? `<span class="badge">${s.badge}</span>` : ""}
        <button class="iconbtn js-up" ${i === 0 ? "disabled" : ""} aria-label="Поднять блок">${ICON_UP}</button>
        <button class="iconbtn js-down" ${i === order.length - 1 ? "disabled" : ""} aria-label="Опустить блок">${ICON_DOWN}</button>
        <button class="iconbtn js-toggle" aria-label="Свернуть или развернуть">${ICON_CHEV}</button>
      </div>
      <div class="block-body">${s.body()}</div>
    </section>`;
  }).join("");
}
render();
renderFx();

panelIn.addEventListener("click", e => {
  const editTarget = e.target.closest(".js-edit");
  if (editTarget && !editTarget.querySelector("input")) {
    const path = editTarget.dataset.path, unit = editTarget.dataset.unit;
    const input = document.createElement("input");
    input.type = unit === "text" ? "text" : "number";
    input.placeholder = unit === "text" ? "значение" : "сумма";
    editTarget.textContent = "";
    editTarget.appendChild(input);
    input.focus();
    const commit = () => {
      const raw = input.value.trim();
      if (raw === "") return render();
      overrides[path] = unit === "text" ? raw : parseFloat(raw.replace(",", "."));
      saveOverrides(overrides);
      applyOverrides();
      recompute();
      render();
      renderFx();
      if (window.echarts) drawMap();
    };
    input.addEventListener("keydown", ev => { if (ev.key === "Enter") commit(); });
    input.addEventListener("blur", commit);
    return;
  }
  const hideTarget = e.target.closest(".js-hide");
  if (hideTarget) {
    const i = hideTarget.dataset.i;
    const name = hideTarget.dataset.name || "эту позицию";
    if (!confirm(`Убрать «${name}» из списка? Можно будет вернуть через «Скрытые» внизу блока.`)) return;
    overrides[`hidden.${i}`] = true;
    saveOverrides(overrides);
    recompute();
    render();
    renderFx();
    if (window.echarts) drawMap();
    return;
  }
  const restoreTarget = e.target.closest(".js-restore");
  if (restoreTarget) {
    const i = restoreTarget.dataset.i;
    delete overrides[`hidden.${i}`];
    saveOverrides(overrides);
    recompute();
    render();
    renderFx();
    if (window.echarts) drawMap();
    return;
  }
  const block = e.target.closest(".block");
  if (!block) return;
  const id = block.dataset.id;
  if (e.target.closest(".js-toggle")) {
    collapsed[id] = !collapsed[id];
    saveLayout(order, collapsed);
    render();
  } else if (e.target.closest(".js-up") || e.target.closest(".js-down")) {
    const i = order.indexOf(id);
    const j = e.target.closest(".js-up") ? i - 1 : i + 1;
    if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    saveLayout(order, collapsed);
    render();
  }
});

/* drag handle — переупорядочивание мышью на десктопе; кнопки ▲▼ остаются основным
   способом на тач-устройствах, где HTML5 drag-and-drop ненадёжен. */
let dragId = null;
panelIn.addEventListener("dragstart", e => {
  const block = e.target.closest(".block");
  if (!e.target.closest(".handle") || !block) { e.preventDefault(); return; }
  dragId = block.dataset.id;
  block.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
});
panelIn.addEventListener("dragend", e => {
  const block = e.target.closest(".block");
  if (block) block.classList.remove("dragging");
  panelIn.querySelectorAll(".drop-before,.drop-after").forEach(b => b.classList.remove("drop-before", "drop-after"));
  dragId = null;
});
panelIn.addEventListener("dragover", e => {
  if (!dragId) return;
  const block = e.target.closest(".block");
  if (!block || block.dataset.id === dragId) return;
  e.preventDefault();
  const rect = block.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  panelIn.querySelectorAll(".drop-before,.drop-after").forEach(b => b.classList.remove("drop-before", "drop-after"));
  block.classList.add(before ? "drop-before" : "drop-after");
});
panelIn.addEventListener("drop", e => {
  if (!dragId) return;
  const block = e.target.closest(".block");
  if (!block || block.dataset.id === dragId) return;
  e.preventDefault();
  const rect = block.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  order = order.filter(id => id !== dragId);
  const targetIndex = order.indexOf(block.dataset.id);
  order.splice(before ? targetIndex : targetIndex + 1, 0, dragId);
  saveLayout(order, collapsed);
  render();
});

/* ---------- легенда и mind map ---------- */
document.getElementById("legend").innerHTML =
  DATA.categories.map(c => `<span><i style="background:${css(c.color)}"></i>${c.name}</span>`).join("") +
  `<span><i style="background:${css('--cat-income')}"></i>Доходы</span>`;

let chart;
function drawMap() {
  const ink = css("--ink"), line = css("--line"), sheet = css("--paper");
  const leaf = (name, v, col, extra) => ({
    name: v ? `${name}\n${rub(v)}` : name,
    itemStyle: {color: v ? col : sheet, borderColor: col, borderWidth: v ? 0 : 1.5},
    label: {color: ink},
    ...extra
  });
  const exp = DATA.categories.map(c => {
    const items = pm.filter(p => p.cat === c.name);
    const v = items.reduce((a, p) => a + (p.m || 0), 0);
    const col = css(c.color);
    return {
      name: `${c.name}\n${v ? rub(v) : items.length + " поз."}`,
      itemStyle: {color: col, borderColor: col},
      label: {color: ink, fontWeight: 600},
      children: items.map(p => leaf(p.name, p.m, col, {_pay: p._i}))
    };
  }).filter(x => x.children.length);
  const incCol = css("--cat-income");
  const incItems = DATA.incomes.map((x, i) => ({...x, _i: i}));
  const incCats = [...new Set(DATA.incomes.map(i => i.cat))].map(c => ({
    name: c, itemStyle: {color: sheet, borderColor: incCol, borderWidth: 1.5}, label: {color: ink, fontWeight: 600},
    children: incItems.filter(i => i.cat === c).map(i => leaf(i.name, i.sum, incCol, {_inc: i._i}))
  }));
  const root = {
    name: "Я", itemStyle: {color: ink, borderColor: ink}, label: {color: "#FFFFFF", fontWeight: 600},
    children: [
      {name: `Расходы\n${rub(burn)}/мес`, itemStyle: {color: ink, borderColor: ink}, label: {color: ink, fontWeight: 600}, children: exp},
      {name: "Доходы\nсуммы не внесены", itemStyle: {color: ink, borderColor: ink}, label: {color: ink, fontWeight: 600}, children: incCats}
    ]
  };
  const narrow = innerWidth < 760;
  chart = chart || echarts.init(document.getElementById("map"), null, {renderer: "svg"});
  chart.setOption({
    animationDuration: 500,
    tooltip: {trigger: "item", backgroundColor: sheet, borderColor: line, textStyle: {color: ink, fontFamily: "Golos Text"}},
    series: [{
      type: "tree", data: [root], layout: "radial", roam: true, expandAndCollapse: true,
      initialTreeDepth: narrow ? 2 : 3, symbol: "circle", symbolSize: 10,
      top: narrow ? "4%" : "6%", bottom: narrow ? "4%" : "6%",
      left: narrow ? "4%" : "4%", right: narrow ? (innerWidth < 500 ? "4%" : "30%") : "30%",
      lineStyle: {color: line, width: 1.3, curveness: .5},
      label: {fontFamily: "Golos Text", fontSize: narrow ? 10 : 12, lineHeight: 15},
      emphasis: {focus: "descendant"}
    }]
  }, true);
  chart.off("click");
  chart.on("click", params => {
    const d = params.data;
    if (!d || d.children) return; // клик по категории/корню — нечего открывать
    if (d._pay != null) jumpToItem("categories", `pay-${d._pay}`);
    else if (d._inc != null) jumpToItem("incomes", `inc-${d._inc}`);
  });
}
/* Клик по листу MindMap -> разворачиваем нужный блок панели, открываем его
   карточку категории и подсвечиваем строку, чтобы можно было сразу поправить сумму. */
function jumpToItem(blockId, elId) {
  if (collapsed[blockId]) { collapsed[blockId] = false; saveLayout(order, collapsed); }
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById(elId);
    if (!el) return;
    const details = el.closest("details");
    if (details) details.open = true;
    el.scrollIntoView({behavior: "smooth", block: "center"});
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);
  });
}
const isMobile = () => innerWidth <= 760;
if (isMobile()) {
  document.querySelector(".canvas").remove(); // на мобильном mind map не нужен — экономим загрузку echarts
} else if (window.echarts) {
  drawMap();
  addEventListener("resize", () => { if (isMobile()) return; chart && chart.resize(); });
} else {
  document.getElementById("map").outerHTML = '<p class="note" style="padding:100px 40px 40px">Карта не загрузилась: нет доступа к cdnjs.cloudflare.com.</p>';
}
loadProjects();
loadPayments();
loadIncomes();
</script>
